<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}html{color-scheme:light}</style>
<title>Campus Náutico Kresala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--surface-2:#EBEDE8;--line:#DDE0DA;--line-2:#C7CCC4;
  --ink:#121F33;--muted:#5F6A78;--faint:#8F99A6;
  --accent:#9A7A3E;--accent-ink:#FFFFFF;--accent-soft:#F1EBDE;
  --navy:#121F33;--navy-ink:#F3F4F1;--navy-line:rgba(255,255,255,.14);
  --ok:#2E6B4F;--ok-soft:#E3EEE8;--warn:#9C6A1F;--warn-soft:#F4EBDB;--bad:#9B2C2C;--bad-soft:#F4E4E3;
  --motor:#2B4C7E;--motor-soft:#E5EAF3;--radio:#5B5F97;--radio-soft:#E8E8F3;--vela:#2E7D7A;--vela-soft:#E1EFEE;
  --shadow:0 1px 0 rgba(18,31,51,.03),0 14px 30px -24px rgba(18,31,51,.25);
  --radius:6px;
  --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1;font-weight:600;letter-spacing:-.005em;font-variant-numeric:lining-nums}
h1{font-size:2.05rem}
h2{font-size:1.5rem}
h3,h4{margin:0;font-weight:600;font-size:.95rem;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--navy-line)}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;font-family:var(--font-display);font-size:1.15rem;font-weight:600;color:#fff;flex:none;line-height:1}
.brand .name{font-family:var(--font-display);font-size:1.35rem;font-weight:600;line-height:1;letter-spacing:.01em;display:block}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;opacity:.65;margin-top:4px}
.demo-badge{font-size:.6rem;text-transform:uppercase;letter-spacing:.16em;border:1px solid rgba(255,255,255,.3);border-radius:2px;padding:5px 10px;opacity:.75;white-space:nowrap;font-weight:500}
.role-switch{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:2px;flex:none}
.role-switch button{border:0;background:transparent;color:inherit;padding:6px 16px;border-radius:2px;font-weight:600;cursor:pointer;opacity:.7;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.role-switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);opacity:1}
@media(max-width:640px){.demo-badge{display:none}.brand small{display:none}.role-switch button{padding:6px 10px}}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1280px;margin:0 auto}
.sidenav{padding:28px 18px;border-right:1px solid var(--line);position:sticky;top:calc(57px + env(safe-area-inset-top,0px));align-self:start}
.sidenav .who{padding:2px 12px 18px;font-size:.78rem;color:var(--muted);line-height:1.45;border-bottom:1px solid var(--line);margin-bottom:12px}
.sidenav .who b{display:block;color:var(--ink);font-family:var(--font-display);font-size:1.25rem;font-weight:600;line-height:1.15;margin-bottom:3px}
.sidenav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;border-left:2px solid transparent;background:transparent;padding:9px 12px;border-radius:0;font-weight:500;cursor:pointer;color:var(--muted);font-size:.9rem}
.sidenav button[aria-current="page"]{border-left-color:var(--accent);color:var(--ink);font-weight:700}
.sidenav .count{font-size:.62rem;font-weight:700;background:var(--bad);color:#fff;border-radius:2px;padding:1px 6px;min-width:20px;text-align:center}
.main{padding:32px 32px 56px;min-width:0}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.sidenav{display:none}.main{padding:18px 16px 96px}}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:0 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media(max-width:900px){.tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}}
.tabbar button{border:0;background:transparent;padding:10px 2px 8px;font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative;border-top:2px solid transparent}
.tabbar button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.tabbar .count{position:absolute;top:5px;right:8px;font-size:.56rem;background:var(--bad);color:#fff;border-radius:2px;padding:0 4px}

/* layout helpers */
.stack{display:grid;gap:16px}
.stack-s{display:grid;gap:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.page-head .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
.card.flat{background:transparent;color:var(--muted)}
.card.hi{border-color:var(--accent);box-shadow:var(--shadow)}
.eyebrow{font-size:.64rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1 1 200px;min-width:0}
.row .actions{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.motor{background:var(--motor-soft);color:var(--motor)}.pill.radio{background:var(--radio-soft);color:var(--radio)}.pill.vela{background:var(--vela-soft);color:var(--vela)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.off{background:transparent;border-color:var(--line-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:3px;font-weight:600;cursor:pointer;font-size:.82rem;line-height:1.3;white-space:nowrap;letter-spacing:.02em;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.btn.ghost:hover{text-decoration-color:var(--ink);border-color:transparent}
.btn.small{padding:5px 10px;font-size:.76rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .v{font-family:var(--font-display);font-size:2.3rem;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.kpi .v.bad{color:var(--bad)}.kpi .v.warn{color:var(--warn)}.kpi .v.ok{color:var(--ok)}
.kpi .l{font-size:.66rem;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.notice{padding:10px 14px;border-radius:3px;font-size:.86rem;line-height:1.45;border-left:2px solid var(--line-2);background:var(--surface);color:var(--ink)}
.notice.warn{border-left-color:var(--warn)}.notice.bad{border-left-color:var(--bad)}.notice.ok{border-left-color:var(--ok)}.notice.info{border-left-color:var(--accent)}
.table-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:640px}
th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-2);font-weight:600}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface-2)}
.field{display:grid;gap:5px;font-size:.85rem}
.field label{font-weight:600;color:var(--muted);font-size:.64rem;text-transform:uppercase;letter-spacing:.1em}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-2);background:var(--surface);border-radius:2px;padding:5px 12px;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.session{display:grid;grid-template-columns:auto 1fr auto;gap:12px 18px;align-items:start}
.session .date{font-family:var(--font-display);font-weight:600;font-size:1.55rem;line-height:1;min-width:78px;font-variant-numeric:lining-nums}
.session .date small{display:block;font-family:var(--font-body);font-weight:600;font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:5px}
.session .meta{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.session .cta{display:grid;gap:6px;justify-items:end}
@media(max-width:560px){.session{grid-template-columns:auto 1fr}.session .cta{grid-column:1/-1;justify-items:start;grid-auto-flow:column;justify-content:start}}
.confirm{margin-top:14px;padding:14px;border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--surface);display:grid;gap:8px}
.route{display:grid;gap:0}
.route .step{display:grid;grid-template-columns:20px 1fr auto;gap:10px 12px;align-items:start;padding:13px 0;border-top:1px solid var(--line)}
.route .step:first-child{border-top:0;padding-top:0}
.route .step .dot{margin-top:7px}
.route .step .t{font-weight:600}
.route .step .d{font-size:.84rem;color:var(--muted)}
.route .step .cta{align-self:center}
@media(max-width:560px){.route .step{grid-template-columns:20px 1fr}.route .step .cta{grid-column:2}}
.ring{width:96px;height:96px;flex:none}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero .txt{flex:1 1 220px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-head h3{font-family:var(--font-display);font-size:1.35rem;font-weight:600;text-transform:capitalize}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:6px}
.cal-week span{padding:0 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .d{min-height:82px;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:3px;padding:4px;background:var(--surface);font-size:.74rem}
.cal .d.empty{border-style:dashed;background:transparent}
.cal .d.today{border-color:var(--accent)}
.cal .d .n{font-weight:600;color:var(--muted);padding:0 2px;font-variant-numeric:tabular-nums}
.cal .d.today .n{color:var(--accent)}
.cal .chip{display:block;width:100%;text-align:left;border:0;border-left:2px solid transparent;border-radius:2px;padding:2px 5px;font-size:.66rem;font-weight:600;margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.cal .chip.motor{background:var(--motor-soft);color:var(--motor);border-left-color:var(--motor)}.cal .chip.radio{background:var(--radio-soft);color:var(--radio);border-left-color:var(--radio)}.cal .chip.vela{background:var(--vela-soft);color:var(--vela);border-left-color:var(--vela)}
.cal .chip.full{opacity:.55}
.cal .chip[aria-pressed="true"]{outline:1.5px solid var(--ink);outline-offset:1px}
@media(max-width:600px){.cal .d{min-height:58px;padding:3px}.cal .chip{font-size:.56rem;padding:1px 3px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.7rem;color:var(--muted);margin-top:12px;letter-spacing:.04em}
.legend i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px;vertical-align:middle}
.cal-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.cal-layout{grid-template-columns:minmax(0,1fr)}}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:999px;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--surface);border-radius:50%;transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:10px 14px;cursor:pointer;margin-top:6px}
.quiz-opt:hover{border-color:var(--ink)}
.quiz-opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:3px;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px);font-size:.88rem;border:1px solid var(--navy-line)}
@media(min-width:901px){.toast{bottom:24px}}
.receipt{border:1px solid var(--line);border-radius:3px;padding:16px;display:grid;gap:4px;font-size:.86rem;max-width:420px;background:var(--surface)}
.receipt .big{font-family:var(--font-display);font-size:1.8rem;font-weight:600;font-variant-numeric:lining-nums}
.log li{padding:9px 0;border-top:1px solid var(--line);font-size:.84rem;display:flex;gap:12px}
.log li:first-child{border-top:0}
.log{list-style:none;margin:0;padding:0}
.log time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums;font-size:.68rem;padding-top:3px;min-width:52px;letter-spacing:.06em;text-transform:uppercase}
.drawer{position:fixed;inset:0;z-index:25;display:grid;grid-template-columns:1fr min(440px,100%)}
.drawer .scrim{background:rgba(18,31,51,.45)}
.drawer .panel{background:var(--surface);border-left:1px solid var(--line);padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
@media(max-width:600px){.drawer{grid-template-columns:1fr}.drawer .scrim{display:none}}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:.86rem}
dl.kv dt{color:var(--muted);font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding-top:3px}dl.kv dd{margin:0}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.att label{font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:3px;padding:2px 7px;cursor:pointer;background:var(--surface)}
.att input{width:auto;margin:0;accent-color:var(--accent)}
.who select{margin-top:10px;font-size:.78rem;padding:5px 8px;width:100%}
/* calendario del alumno */
.pcal .d{min-height:56px;padding:3px}
.pcal .chip{font-size:.62rem;padding:1px 4px;margin-top:2px}
.pcal .chip.mine{outline:1.5px solid var(--accent);outline-offset:1px}
.chips.view button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.route .t{display:flex;align-items:center;gap:8px}
.route .kicon{width:20px;height:20px}
.route .kicon svg{width:12px;height:12px}
/* ilustración e iconos */
.banner{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.banner-art{height:196px;background:#DDE3E6;position:relative}
.banner-art img{width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block}
.banner-art svg{width:100%;height:100%;display:block}
.banner-txt{padding:16px 18px 18px}
.banner-txt .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.kicon{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--surface-2);align-items:center;justify-content:center;flex:none}
.kicon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kicon.motor{color:var(--motor);background:var(--motor-soft)}.kicon.radio{color:var(--radio);background:var(--radio-soft)}.kicon.vela{color:var(--vela);background:var(--vela-soft)}
.wave{display:block;width:100%;height:14px;margin-top:12px;color:var(--line-2)}
/* modo móvil forzado para el alumno en pantallas anchas */
body.phone-mode{background:var(--surface-2)}
body.phone-mode .shell{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;width:414px;max-width:calc(100% - 32px);height:calc(100vh - 57px - 74px);min-height:560px;margin:22px auto 0;border:10px solid #1B1B1F;border-radius:42px;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 34px 60px -30px rgba(18,31,51,.5)}
body.phone-mode .sidenav{display:none}
body.phone-mode .main{padding:22px 16px 28px;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
body.phone-mode .table-wrap{margin:0;padding:0}
body.phone-mode table{min-width:0}
body.phone-mode .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;position:static;padding:0 6px 8px}
body.phone-mode .toast{bottom:30px}
.frame-label{text-align:center;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 16px 22px;font-weight:600}
/* modo escritorio forzado para el equipo en tabletas */
body.desk-mode .shell{grid-template-columns:220px minmax(0,1fr)}
body.desk-mode .sidenav{display:block}
body.desk-mode .tabbar{display:none}
body.desk-mode .main{padding:28px 24px 56px}
/* guía breve */
.hint{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:3px;font-size:.82rem;color:var(--muted);margin-bottom:16px;line-height:1.5}
.hint b{color:var(--ink)}
.hint button{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:0 2px;flex:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- capa intuitiva ---- */

/* ---------- utilidades ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function d(s){const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function fmt(s,withDay=true){const x=d(s);return (withDay?DAYS[x.getDay()]+' ':'')+x.getDate()+' '+MONTHS[x.getMonth()]}
function fmtRange(days){if(days.length===1)return fmt(days[0]);const a=d(days[0]),b=d(days[days.length-1]);if(a.getMonth()===b.getMonth())return DAYS[a.getDay()]+' '+a.getDate()+' y '+DAYS[b.getDay()]+' '+b.getDate()+' '+MONTHS[a.getMonth()];return fmt(days[0])+' y '+fmt(days[days.length-1])}
function fmtShort(days){if(days.length===1){const a=d(days[0]);return a.getDate()+' '+MONTHS[a.getMonth()]}const a=d(days[0]),b=d(days[days.length-1]);if(a.getMonth()===b.getMonth())return a.getDate()+'–'+b.getDate()+' '+MONTHS[a.getMonth()];return a.getDate()+' '+MONTHS[a.getMonth()]+'–'+b.getDate()+' '+MONTHS[b.getMonth()]}
function daysUntil(s){return Math.round((d(s)-new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()))/86400000)}
const eur=n=>n.toLocaleString('es-ES')+' €';
function sess(id){return S.sessions.find(s=>s.id===id)}
function free(s){return s.cap-s.booked.length}
function seatsText(s){const f=free(s);return f<=0?'Completo':f===1?'1 plaza libre':f+' plazas libres'}
function label(s){return KIND[s.kind].name+(s.level&&s.level!=='Todos'?' '+s.level:'')+' · '+fmtShort(s.days)}
function upcoming(){return S.sessions.filter(s=>daysUntil(s.days[0])>=0).sort((a,b)=>a.days[0]<b.days[0]?-1:1)}
function isInstr(){return S.role==='equipo'&&ui.teamRole==='instr'}
function teamUpcoming(){return upcoming().filter(s=>!isInstr()||s.instr===INSTR_ME)}
function myBooked(kind){return S.sessions.find(s=>s.kind===kind&&s.booked.includes('st1'))}
function theory(){const done=S.topics.filter(t=>t.done).length;return {done,total:S.topics.length,pct:Math.round(done/S.topics.length*100)}}
function bestMock(){return S.mocks.reduce((m,x)=>Math.max(m,x.score),0)}
function doc(id){return S.docs.find(x=>x.id===id)}
function stuName(id){const s=S.students.find(x=>x.id===id);return s?s.name:id}
function stu(id){
  const base=S.students.find(x=>x.id===id);if(!base)return null;
  const booked=upcoming().filter(s=>s.booked.includes(id)).map(s=>KIND[s.kind].name+' '+fmtShort(s.days));
  if(id!=='st1'){return Object.assign({},base,{practices:[base.done,...booked].filter(Boolean).join(' · ')||'Sin reservas'})}
  const med=doc('medico'),t=theory(),due=S.payments.items.find(p=>p.status==='due');
  const docs=med.status==='ok'?{s:'ok',t:'Completa'}:med.status==='review'?{s:'warn',t:'Médico en revisión'}:{s:'bad',t:'Falta médico'};
  const pay=!due?{s:'ok',t:'Pagado'}:daysUntil(due.due)<0?{s:'bad',t:'Cuota '+due.n+' vencida'}:{s:'warn',t:'Cuota '+due.n+' vence el '+fmt(due.due,false)};
  const next=med.status!=='ok'?'Reclamar certificado médico':!myBooked('radio')?'Reservar curso de radio':'Inscripción examen 5 nov';
  return Object.assign({},base,{theory:t.pct,docs,pay,next,practices:booked.join(' · ')||'Sin reservas'});
}
function conflicts(days,boat,instr,excludeId){
  const out=[];
  for(const s of S.sessions){if(s.id===excludeId)continue;const day=days.find(x=>s.days.includes(x));if(!day)continue;
    if(s.boat===boat)out.push(boat+' ya tiene prácticas el '+fmt(day)+' ('+label(s)+').');
    if(s.instr===instr)out.push(instr+' ya está en '+label(s)+' el '+fmt(day)+'.');}
  const b=S.boats.find(x=>x.name===boat);if(b&&b.maint.length){const m=b.maint.find(x=>days.includes(x));if(m)out.push(boat+' está en taller el '+fmt(m)+'.')}
  return out;
}
function alerts(){
  const a=[];
  for(const s of teamUpcoming()){
    if(daysUntil(s.days[0])>21)continue;
    for(const id of s.booked){const st=stu(id);if(!st)continue;if(st.docs.s==='bad')a.push({lvl:'bad',text:st.name+' tiene '+KIND[s.kind].name.toLowerCase()+' el '+fmtShort(s.days)+' y '+st.docs.t.toLowerCase()+'.',act:'notify-stu:'+id,btn:'Reclamar'})}
    const f=free(s);if(f>0){const wl=(S.waitlist[s.id]||[]).length;a.push({lvl:'warn',text:label(s)+' ('+s.boat+'): '+seatsText(s).toLowerCase()+(wl?' · '+wl+' en lista de espera':'.'),act:wl?'notify-wl:'+s.id:'tab:calendario',btn:wl?'Avisar lista':'Ver'})}
  }
  if(!isInstr()){
  for(const st of S.students){const x=stu(st.id);if(x.pay.s==='bad')a.push({lvl:'bad',text:x.name+': '+x.pay.t.toLowerCase()+'.',act:'notify-stu:'+st.id,btn:'Recordar'})}
  const noReg=S.students.filter(s=>['PER','PNB'].includes(s.course)&&!S.registered.includes(s.id)).length;
  a.push({lvl:'warn',text:'Inscripción a la convocatoria del 5 nov: cierra el 6 oct y hay '+noReg+' alumnos de PER/PNB sin inscribir.',act:'tab:gestoria',btn:'Ir a gestoría'});
  }
  return a;
}

function waveLine(){return '<svg class="wave" viewBox="0 0 400 14" preserveAspectRatio="none" aria-hidden="true"><path d="M0 7c25-8 50-8 75 0s50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 25 8 25 0" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>'}

function route(){
  const t=theory(),motor=myBooked('motor'),radio=myBooked('radio'),vela=myBooked('vela'),med=doc('medico'),due=S.payments.items.find(p=>p.status==='due');
  return [
    {label:'Teoría · 11 temas',status:t.done===t.total?'ok':'warn',detail:t.done+' de '+t.total+' temas estudiados · mejor simulacro '+bestMock()+'/45',cta:t.done===t.total?null:{act:'tab:teoria',label:'Seguir con el tema '+(t.done+1)}},
    {label:'Certificado médico',status:med.status==='ok'?'ok':med.status==='review'?'warn':'bad',detail:med.status==='review'?'Subido hoy · la escuela lo revisa en 24 h':med.status==='ok'?'Validado':'Sin subir · lo necesitas antes del 3 oct (prácticas del 10 oct) y para el examen',cta:med.status==='pending'?{act:'tab:docs',label:'Subir'}:null},
    {label:'Prácticas de motor · 16 h',icon:'motor',status:motor?'ok':'bad',detail:motor?'Reservadas: '+fmtRange(motor.days)+' · '+motor.boat+' · '+motor.instr:'Sin reservar',cta:{act:'tab:practicas',label:motor?'Ver reserva':'Reservar'}},
    {label:'Curso de radio · 12 h',icon:'radio',status:radio?'ok':'bad',detail:radio?'Reservado: '+fmtRange(radio.days)+' · '+radio.time+' · aula de radio':'4 h online + 8 h de simulador en la escuela · sin reservar',cta:{act:'practicas-filter:radio',label:radio?'Ver reserva':'Reservar'}},
    {label:'Examen teórico · jue 5 nov',status:S.student.exam.registered?'ok':'off',detail:S.student.exam.registered?'Inscrita por la escuela. Recibirás la citación con hora y aula. Tasas aparte (70 € aprox.).':'Plazo de inscripción hasta el 6 oct. La escuela te inscribe cuando tengamos tu certificado médico. Tasas aparte (70 € aprox.).'},
    {label:'Prácticas de vela · 16 h (opcional)',icon:'vela',status:vela?'ok':'off',detail:vela?'Reservadas: '+fmtRange(vela.days)+' · '+vela.boat:'No es obligatoria para el PER. Si la añades: 200 €.',cta:vela?null:{act:'practicas-filter:vela',label:'Ver fechas'}},
    {label:'Pagos',status:due?(daysUntil(due.due)<0?'bad':'warn'):'ok',detail:due?'Cuota '+due.n+' ('+eur(due.amount)+') vence el '+fmt(due.due,false):'Todo al día',cta:due?{act:'tab:pagos',label:'Pagar'}:null},
    {label:'Título PER',status:'off',detail:'La escuela lo tramita (gestoría incluida) cuando apruebes el examen y completes motor y radio.'}
  ];
}
function ring(pct){const r=40,c=2*Math.PI*r;return '<svg class="ring" viewBox="0 0 96 96" role="img" aria-label="'+pct+' % completado"><circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="9"/><circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'" transform="rotate(-90 48 48)"/><text x="48" y="53" text-anchor="middle" font-family="var(--font-display)" font-weight="800" font-size="20" fill="var(--ink)">'+pct+'%</text></svg>'}
function vInicio(){
  const steps=route(),left=steps.filter(x=>x.status==='bad'||x.status==='warn').length,done=steps.filter(x=>x.status==='ok').length,pct=Math.round(done/steps.length*100);
  const next=upcoming().find(s=>s.booked.includes('st1'));
  return '<div class="stack">'+
    '<div class="banner"><div class="banner-art">'+heroArt()+'</div><div class="banner-txt"><h1>Kaixo, '+esc(S.student.name)+'</h1><p class="sub">Tu camino al PER en un solo sitio. Lo que hagas aquí lo ve el equipo al momento.</p></div></div>'+
    '<div class="card hi"><div class="hero">'+ring(pct)+'<div class="txt"><p class="eyebrow">Tu ruta al título</p><h2>'+(left?'Te quedan '+left+' cosas por resolver':'Todo en marcha')+'</h2><p class="muted small">'+done+' de '+steps.length+' pasos completados. Sin sorpresas: si algo bloquea el examen o las prácticas, aparece en rojo.</p></div></div></div>'+
    '<div class="grid-2">'+
      '<div class="card"><div class="route">'+steps.map(s=>'<div class="step"><span class="dot '+s.status+'"></span><div><div class="t">'+(s.icon?kicon(s.icon):'')+'<span>'+esc(s.label)+'</span></div><div class="d">'+esc(s.detail)+'</div></div>'+(s.cta?'<div class="cta"><button type="button" class="btn small '+(s.status==='bad'?'primary':'')+'" data-act="'+s.cta.act+'">'+esc(s.cta.label)+'</button></div>':'')+'</div>').join('')+'</div></div>'+
      '<div class="stack">'+
        (next?'<div class="card"><p class="eyebrow">Tu próxima cita</p><h3 style="margin-top:4px">'+esc(KIND[next.kind].name+' · '+fmtRange(next.days))+'</h3><p class="small muted">'+esc(next.time+' · '+next.boat+' · '+next.instr)+'</p><p class="small muted">'+esc(S.boats.find(b=>b.name===next.boat)?.base||'')+'</p><p class="small" style="margin-top:8px"><b>Lleva:</b> DNI, ropa de abrigo e impermeable, calzado cerrado, agua y comida. Asistencia obligatoria al 100 % de las horas.</p><div style="margin-top:10px"><span class="pill accent">Faltan '+daysUntil(next.days[0])+' días</span></div>'+waveLine()+'</div>':'')+
        '<div class="card"><p class="eyebrow">Avisos</p><ul class="log" style="margin-top:6px">'+S.notices.map(n=>'<li><time>'+esc(fmt(n.date,false))+'</time><span>'+esc(n.text)+'</span></li>').join('')+'</ul></div>'+
        '<div class="card flat small muted">¿Dudas? Escribe al equipo desde Teoría o llama a la escuela: 943 000 000 (ejemplo). WhatsApp: mismo número.</div>'+
      '</div>'+
    '</div></div>';
}
function vTeoria(){
  const t=theory(),r=readiness();const quiz=ui.quiz?vQuiz():'';

  const regN=cand.filter(x=>S.registered.includes(x.id)).length,readyN=cand.filter(x=>!S.registered.includes(x.id)&&x.docs.s==='ok').length,pendN=cand.length-regN-readyN;

    '<div class="page-head"><div><h1>Gestoría</h1><p class="sub">Inscripciones a la convocatoria, tasas y expedición de títulos, desde la ficha de cada alumno.</p></div><span class="pill accent">Convocatoria jue 5 nov · plazo 6 oct · faltan '+daysUntil('2026-10-06')+' días</span></div>'+
    '<div class="kpis"><div class="kpi"><div class="v num ok">'+regN+'</div><div class="l">Inscritos</div></div><div class="kpi"><div class="v num">'+readyN+'</div><div class="l">Listos para inscribir</div></div><div class="kpi"><div class="v num '+(pendN?'bad':'')+'">'+pendN+'</div><div class="l">Con documentación pendiente</div></div><div class="kpi"><div class="v num">1</div><div class="l">Títulos en trámite</div></div></div>'+
    '<div class="card"><h2>Inscripción al examen teórico · jueves 5 nov 2026</h2><p class="small muted" style="margin-top:4px">La escuela presenta la solicitud cuando el alumno tiene DNI, foto y certificado médico validados. Las tasas (70 € aprox.) las paga el alumno a la Administración, aparte del pack.</p><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Alumno</th><th>Título</th><th>Documentación</th><th>Prácticas</th><th>Tasas</th><th>Estado</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="grid-2"><div class="card"><h2>Expedición de títulos</h2><div class="list" style="margin-top:8px"><div class="row"><div class="grow"><b>Aitor Sarasola</b> · PER<div class="small muted">Examen aprobado en junio · motor y radio completadas · solicitud presentada el 12 sep</div></div><span class="pill warn">En trámite</span></div><div class="row"><div class="grow"><b>Julen Odriozola</b> · Licencia de navegación<div class="small muted">Título emitido el 25 sep · pendiente de recoger en la escuela</div></div><button type="button" class="btn small" data-act="notify-stu:st10">Avisar para recogerlo</button></div></div></div>'+
    '<div class="card"><h2>Renovaciones y caducidades</h2><div class="list" style="margin-top:8px"><div class="row"><div class="grow"><b>Certificados médicos</b><div class="small muted">Caducan a los 2 años · aviso automático 3 meses antes · 2 alumnos caducan antes de marzo</div></div><span class="pill">Automático</span></div><div class="row"><div class="grow"><b>Prácticas sin examen</b><div class="small muted">Validez 24 meses · aviso 3 meses antes · ningún alumno en riesgo este trimestre</div></div><span class="pill ok">Al día</span></div><div class="row"><div class="grow"><b>Renovación de títulos</b><div class="small muted">PER y PNB se renuevan cada 10 años · la gestoría lo tramita con el certificado médico en vigor</div></div><span class="pill">Sin vencimientos</span></div></div></div></div>'+
  '</div>';
}

/* ---------- acciones ---------- */
const ACT={
  role(r){S.role=r;ui.alumno=null;render();window.scrollTo(0,0);const sh=$('shell'),mn=$('main');if(sh)sh.scrollTop=0;if(mn)mn.scrollTop=0},
  tab(t){if(S.role==='alumno'){S.tab=t}else{S.ttab=t}ui.alumno=null;render();window.scrollTo(0,0);const sh=$('shell'),mn=$('main');if(sh)sh.scrollTop=0;if(mn)mn.scrollTop=0},
  'practicas-filter'(k){S.tab='practicas';ui.filter=k;render();window.scrollTo(0,0)},
  filter(k){ui.filter=k;render()},
  'topic-done'(n){const t=S.topics.find(x=>x.n===+n);t.done=true;logAdd(S.student.full+' ha marcado el tema '+n+' como estudiado.');toast('Tema '+n+' marcado como estudiado');render()},
  'quiz-topic'(n){ui.quiz={i:0,answers:[],done:false,topic:+n||null};render();window.scrollTo(0,0)},
  'quiz-answer'(i){ui.quiz.answers[ui.quiz.i]=+i;render()},
  'quiz-next'(){const q=ui.quiz;if(q.i+1<QUIZ.length){q.i++}else{q.done=true;const ok=q.answers.filter((a,i)=>a===QUIZ[i].a).length;if(q.topic){const t=S.topics.find(x=>x.n===q.topic);const sc=Math.round(ok/QUIZ.length*10);t.done=true;t.score=Math.max(t.score||0,sc);(ATTEMPTS[q.topic]=ATTEMPTS[q.topic]||[]).push({d:iso(TODAY),s:sc,t:'2 min'});logAdd(S.student.full+' ha hecho el test del tema '+q.topic+' ('+sc+'/10).')}else{S.mocks.push({date:iso(TODAY),score:30+ok*5,ripa:Math.max(0,3-ok),baliz:1,carta:1,time:'3 min · muestra'});logAdd(S.student.full+' ha hecho un simulacro ('+(30+ok*5)+'/45).')}}render()},
  'quiz-close'(){ui.quiz=null;render()},
  ask(){const v=$('question').value.trim();if(!v){toast('Escribe la pregunta primero');return}ui.question='';logAdd(S.student.full+' ha preguntado al equipo docente: “'+v.slice(0,60)+(v.length>60?'…':'')+'”');toast('Pregunta enviada. Te responden en el campus.');render()},
  book(id){ui.booking=id;render()},
  'book-cancel'(){ui.booking=null;render()},
  'book-confirm'(id){const s=sess(id);if(free(s)<=0){toast('Se acaba de llenar. Te apuntamos a la lista de espera.');(S.waitlist[id]=S.waitlist[id]||[]).push('st1');ui.booking=null;render();return}s.booked.push('st1');ui.booking=null;S.notices.unshift({date:iso(TODAY),text:'Reserva confirmada: '+label(s)+' · '+s.boat+' · '+s.instr+'.'});logAdd(S.student.full+' ha reservado '+label(s)+' ('+s.booked.length+'/'+s.cap+').');toast('Reserva confirmada · '+label(s));render()},
  waitlist(id){const wl=S.waitlist[id]=S.waitlist[id]||[];const i=wl.indexOf('st1');if(i>=0){wl.splice(i,1);toast('Has salido de la lista de espera')}else{wl.push('st1');logAdd(S.student.full+' se ha apuntado a la lista de espera de '+label(sess(id))+'.');toast('Apuntada a la lista de espera. Te avisamos si se libera plaza.')}render()},
  'change-start'(id){ui.changing=id;render();window.scrollTo(0,0)},
  'change-cancel'(){ui.changing=null;render()},
  'change-to'(id){const from=sess(ui.changing),to=sess(id);from.booked=from.booked.filter(x=>x!=='st1');to.booked.push('st1');S.changeUsed=true;ui.changing=null;S.notices.unshift({date:iso(TODAY),text:'Cambio de fecha hecho: '+label(from)+' → '+label(to)+'.'});logAdd(S.student.full+' ha cambiado '+label(from)+' por '+label(to)+'. Queda 1 plaza libre el '+fmtShort(from.days)+'.');toast('Fecha cambiada a '+fmtRange(to.days));render()},
  pay(n){ui.paying=+n;ui.receipt=null;render();window.scrollTo(0,0)},
  'pay-cancel'(){ui.paying=null;render()},
  'pay-confirm'(n){const it=S.payments.items.find(x=>x.n===+n);it.status='paid';it.method=$('pay-method').value.split(' (')[0];it.ref='R-2026-0'+(160+ +n);it.paidOn=iso(TODAY);ui.paying=null;logAdd(S.student.full+' ha pagado la cuota '+n+' ('+eur(it.amount)+', '+it.method+').');toast('Pago registrado · cuota '+n);render()},
  receipt(n){ui.receipt=+n;ui.paying=null;render()},
  'receipt-close'(){ui.receipt=null;render()},
  'cal-prev'(){const [y,m]=ui.cal.split('-').map(Number);const x=new Date(y,m-2,1);ui.cal=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');render()},
  'cal-next'(){const [y,m]=ui.cal.split('-').map(Number);const x=new Date(y,m,1);ui.cal=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');render()},
  'session-open'(id){S.ttab='calendario';ui.session=id;ui.cal=sess(id).days[0].slice(0,7);render()},
  'session-close'(){ui.session=null;render()},
  'new-session'(){ui.newSession=!ui.newSession;ui.formErrors=[];render()},
  unbook(arg,el){const [sid,stid]=el.dataset.act.split(':').slice(1);const s=sess(sid);s.booked=s.booked.filter(x=>x!==stid);logAdd(stuName(stid)+' quitado de '+label(s)+' por el equipo. Queda '+seatsText(s).toLowerCase()+'.');toast(stuName(stid)+' quitado de la sesión');render()},
  remind(id){const s=sess(id);logAdd('Recordatorio enviado a '+s.booked.length+' alumnos de '+label(s)+' (email + WhatsApp).');toast('Recordatorio enviado a '+s.booked.length+' alumnos');render()},
  'notify-wl'(id){const s=sess(id),wl=S.waitlist[id]||[];logAdd('Aviso de plaza libre enviado a '+wl.length+' en lista de espera de '+label(s)+'.');toast('Aviso enviado a '+wl.length+' en lista de espera');render()},
  'notify-stu'(id){logAdd('Aviso enviado a '+stuName(id)+' (email + WhatsApp).');toast('Aviso enviado a '+stuName(id));render()},
  'review-ok'(i){const r=S.reviewQueue.splice(+i,1)[0];if(r.who===S.student.full){doc('medico').status='ok';doc('medico').note='Validado por la escuela';doc('examen').status='pending';doc('examen').note='Con el médico validado, la escuela presenta tu solicitud antes del 6 oct.';const st=S.students.find(x=>x.name===r.who)}else{const st=S.students.find(x=>x.name===r.who);if(st)st.docs={s:'ok',t:'Completa'}}logAdd(r.what+' de '+r.who+' validado.');toast(r.what+' de '+r.who+' validado');render()},
  inscribir(id){if(!S.registered.includes(id))S.registered.push(id);if(id==='st1'){S.student.exam.registered=true;const e=doc('examen');e.status='ok';e.note='Presentada por la escuela el '+fmt(iso(TODAY),false)+' · tasas 70 € aprox. a tu cargo';S.notices.unshift({date:iso(TODAY),text:'La escuela te ha inscrito a la convocatoria del 5 nov. Recibirás la citación con hora y aula.'})}logAdd(stuName(id)+' inscrito a la convocatoria del 5 nov (gestoría).');toast(stuName(id)+' inscrito a la convocatoria del 5 nov');render()},
  'hint-close'(){ui.hintHidden[S.role]=true;render()},
  'doc-open'(arg,el){const q=el.dataset.act.split(':');ui.docview={type:q[1],id:q[2],extra:q[3]};render()},
  'doc-close'(){ui.docview=null;render()},
  'topic-hist'(n){ui.topicOpen=ui.topicOpen===+n?null:+n;render()},
  pview(v){ui.pview=v;render()},
  psel(id){ui.psel=ui.psel===id?null:id;render()},
  'pcal-prev'(){const [y,m]=ui.pcal.split('-').map(Number);const x=new Date(y,m-2,1);ui.pcal=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');ui.psel=null;render()},
  'pcal-next'(){const [y,m]=ui.pcal.split('-').map(Number);const x=new Date(y,m,1);ui.pcal=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');ui.psel=null;render()},
  'alumno-open'(id){ui.alumno=id;render()},
  'alumno-close'(){ui.alumno=null;render()}
};
const CHG={
  upload(id,el){const f=el.files&&el.files[0];if(!f)return;const x=doc(id);x.status='review';x.note='Subido hoy ('+f.name+') · la escuela lo revisa en 24 h';S.reviewQueue.unshift({who:S.student.full,what:x.name,when:'ahora'});logAdd(S.student.full+' ha subido '+x.name.toLowerCase()+'.');toast(x.name+' subido · en revisión');render()},
  'add-student'(sid,el){const id=el.value;if(!id)return;const s=sess(sid);if(free(s)<=0){toast('Sesión completa');return}s.booked.push(id);logAdd(stuName(id)+' añadido a '+label(s)+' por el equipo ('+s.booked.length+'/'+s.cap+').');toast(stuName(id)+' añadido');render()},
  rule(id,el){const r=S.rules.find(x=>x.id===id);r.on=el.checked;toast(r.name+': '+(r.on?'activado':'apagado'));render()},
  att(arg,el){const [,sid,stid,day]=el.dataset.change.split(':');const a=S.attendance[sid]=S.attendance[sid]||{};const arr=a[stid]=a[stid]||[];arr[+day]=el.checked;const s=sess(sid);if(s.days.every((d,i)=>arr[i])){logAdd(stuName(stid)+' ha completado el 100 % de '+label(s)+'. Certificado de prácticas listo para emitir.');toast('100 % de asistencia · certificado de prácticas listo')}render()},
  'team-role'(arg,el){ui.teamRole=el.value;if(isInstr()&&!INSTR_TABS.includes(S.ttab))S.ttab='hoy';ui.session=null;ui.alumno=null;toast(isInstr()?'Vista de instructor: solo tus sesiones':'Vista de secretaría: acceso completo');render()}
};
function createSession(form){
  const f=new FormData(form),kind=f.get('kind'),date=f.get('date'),n=+f.get('days'),boat=f.get('boat'),instr=f.get('instr'),cap=+f.get('cap')||6,time=f.get('time')||'09:00–18:00',level=kind==='motor'?f.get('level'):'Todos';
  const days=[date];if(n===2){const x=d(date);x.setDate(x.getDate()+1);days.push(iso(x))}
  const errs=conflicts(days,boat,instr);if(kind==='radio'&&boat!=='Aula de radio')errs.push('El curso de radio se da en el aula de radio.');if(kind!=='radio'&&boat==='Aula de radio')errs.push('Para navegar hace falta un barco.');
  if(!date||daysUntil(date)<0)errs.push('La fecha debe ser futura.');
  if(errs.length){ui.formErrors=errs;render();return}
  const id=kind[0].toUpperCase()+'-'+date.slice(5).replace('-','')+'-'+Math.floor(Math.random()*90+10);
  S.sessions.push({id,kind,level,days,hours:kind==='radio'?8:n===2?16:8,time,boat,instr,cap,booked:[]});
  ui.newSession=false;ui.formErrors=[];ui.session=id;ui.cal=date.slice(0,7);logAdd('Nueva fecha publicada: '+KIND[kind].name+' '+fmtShort(days)+' · '+boat+' · '+instr+' · '+cap+' plazas. Visible ya para los alumnos.');toast('Fecha publicada · '+cap+' plazas');render();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='LABEL')return;const [name,arg]=el.dataset.act.split(':');if(ACT[name])ACT[name](arg,el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]')){const [name,arg]=e.target.dataset.act.split(':');ACT[name](arg,e.target)}if(e.key==='Escape'){if(ui.docview){ui.docview=null;render()}else if(ui.alumno){ui.alumno=null;render()}}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const [name,arg]=el.dataset.change.split(':');if(CHG[name])CHG[name](arg,el)});
document.addEventListener('submit',e=>{if(e.target.id==='new-session'){e.preventDefault();createSession(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='alumno-search'){ui.search=e.target.value;$('alumnos-body').innerHTML=alumnosRows()}if(e.target.id==='question'){ui.question=e.target.value}});
function start(data){try{if(data&&data.S&&data.S.sessions){Object.assign(S,data.S);if(data.ui)Object.assign(ui,data.ui)}}catch(e){}const h=location.hash.replace('#','');if(h==='equipo'){S.role='equipo'}if(h==='alumno-cal'){S.tab='practicas';ui.pview='cal'}if(['teoria','practicas','docs','pagos'].includes(h)){S.tab=h}render()}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
